    <title>coducktor</title>
    <!-- Theme before first paint — no flash. Mirrors resolveTheme()/applyResolvedTheme() in
         src/lib/theme.ts; keep the two in sync. Shares the legacy cockpit's `cez-theme` key
         ('light' | 'dark' | 'system' | 'lazyvim'); anything else falls back to dark, as legacy does. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cez-theme')
          var lazyvim = pref === 'lazyvim'
          var light =
            pref === 'light' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.toggle('light', light)
          document.documentElement.classList.toggle('lazyvim', lazyvim)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {
          // Storage or matchMedia unavailable — the default dark tokens already apply.
        }
        // Accent + density before first paint, from the localStorage MIRROR of ui-state.json
        // (src/lib/appearance.ts owns the contract; keep the two in sync). Defaults are the
        // absence of the attribute, so only the known deviations are stamped.
        try {
          var accent = localStorage.getItem('cez-accent')
          if (accent === 'violet')
            document.documentElement.dataset.accent = accent
          var density = localStorage.getItem('cez-density')
          if (density === 'compact' || density === 'ultra')
            document.documentElement.dataset.density = density
          if (localStorage.getItem('cez-width') === 'wide')
            document.documentElement.dataset.width = 'wide'
        } catch (e) {
          // Storage unavailable — lime/comfortable defaults already apply.
        }
      })()
    </script>
